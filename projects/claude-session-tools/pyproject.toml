[project]
name = "claude-session-tools"
version = "0.1.0"
description = "Proxy/viewer for Claude Code CLI sessions"
requires-python = ">=3.11"
dependencies = ["click>=8.1", "rich>=13.7", "watchfiles>=0.21"]

[project.scripts]
claude-session = "claude_session_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_session_tools"]
