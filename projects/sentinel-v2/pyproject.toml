[project]
name = "sentinel-v2"
version = "0.1.0"
description = "Sentinel V2 — CrewAI-powered agent swarm for HIM"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.80.0",
    "crewai-tools",
    "chromadb>=0.4.0",
    "httpx",
    "pydantic>=2.0",
    "python-dotenv",
    "lancedb",
    "loguru",
    "ollama",
    "flask>=3.0",
    "flask-cors>=4.0",
    "flask-socketio>=5.3",
    "eventlet>=0.36",
    "stripe>=7.0",
    "langfuse>=2.50",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
]
