# Two Python services in Docker:
#   - sentinel: the CrewAI daemon (research → match → build → security → approve → deploy)
#   - flask:    the dashboard API (Socket.IO + REST) that the Next.js UI talks to
#
# The Next.js dashboard (dashboard-nextjs/) is NOT in Docker — run it locally with:
#   cd dashboard-nextjs && npm run dev
# It connects to Flask at http://localhost:5173.

services:
  sentinel:
    build: .
    command: python -m sentinel_v2.main --mode daemon
    env_file: .env
    environment:
      SENTINEL_TMPDIR: /tmp/sentinel_shared
    volumes:
      - sentinel_tmp:/tmp/sentinel_shared
      - ./sentinel.db:/app/sentinel.db
    restart: unless-stopped

  flask:
    build: .
    command: python run_dashboard.py
    env_file: .env
    environment:
      SENTINEL_TMPDIR: /tmp/sentinel_shared
    volumes:
      - sentinel_tmp:/tmp/sentinel_shared
      - ./sentinel.db:/app/sentinel.db
    ports:
      - "5173:5173"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173/api/state || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sentinel_tmp:
