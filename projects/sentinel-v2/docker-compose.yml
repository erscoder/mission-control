# Two Python services in Docker:
#   - sentinel: the CrewAI daemon (research → match → build → security → approve → deploy)
#   - flask:    the dashboard API (Socket.IO + REST) that the Next.js UI talks to
#
# The Next.js dashboard (dashboard-nextjs/) is NOT in Docker — run it locally with:
#   cd dashboard-nextjs && npm run dev
# It connects to Flask at http://localhost:5173.

services:
  sentinel:
    build: .
    command: python -m sentinel_v2.main --mode daemon
    env_file: .env
    environment:
      SENTINEL_TMPDIR: /tmp/sentinel_shared
      # Sandbox: daemon writes draft workspaces under /root/Sentinel inside
      # the container, which is bind-mounted from the operator's ~/Sentinel
      # below. Pinning this env removes the host-vs-container path drift that
      # WORKSPACES_ROOT would otherwise pick up via os.path.expanduser("~").
      SENTINEL_WORKSPACES_ROOT: /root/Sentinel
      # Langfuse tracing — points to shared instance in synapseia-network.
      # Override LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY via .env if
      # you've created a dedicated Sentinel project in the Langfuse UI.
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://host.docker.internal:3700}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-synapseia-dev}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-synapseia-dev}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-true}
      # Cap OTel exporter timeout at 2s (default is 10s). Stops phases from
      # stalling on `flush()` when langfuse-web is unreachable. See F3.5.
      OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-2000}
      OTEL_EXPORTER_OTLP_TRACES_TIMEOUT: ${OTEL_EXPORTER_OTLP_TRACES_TIMEOUT:-2000}
    volumes:
      - sentinel_tmp:/tmp/sentinel_shared
      - ./sentinel.db:/app/sentinel.db
      # Workspace sandbox bind. Linux container kernel namespace makes every
      # OTHER host path physically unreachable from agent shell calls — even
      # the subprocess.run paths that bypass RunShellTool. Operator keeps
      # visibility on ~/Sentinel/draft_* from the mac for debugging.
      - ${HOME}/Sentinel:/root/Sentinel
    restart: unless-stopped
    healthcheck:
      # find -mmin avoids spawning the Python interpreter (slow under cycle load).
      # 120 minutes = 7200 s, matches 2x SENTINEL_LOOP_INTERVAL_HOURS=1.
      test: ["CMD-SHELL", "find /tmp/sentinel_shared/sentinel_v2_state.json -mmin -120 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  flask:
    build: .
    command: python run_dashboard.py
    env_file: .env
    environment:
      SENTINEL_TMPDIR: /tmp/sentinel_shared
      # Same workspace root as the daemon so any future UI feature that
      # introspects workspace files resolves the same paths the daemon writes.
      SENTINEL_WORKSPACES_ROOT: /root/Sentinel
    volumes:
      - sentinel_tmp:/tmp/sentinel_shared
      - ./sentinel.db:/app/sentinel.db
      # Read-only bind: dashboard never mutates workspaces; only the daemon does.
      - ${HOME}/Sentinel:/root/Sentinel:ro
    ports:
      - "5173:5173"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173/api/state || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sentinel_tmp:
