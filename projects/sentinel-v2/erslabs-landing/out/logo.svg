<svg viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>
  <!-- Icon: abstracted lab flask / neural node -->
  <g transform="translate(5, 5)">
    <!-- Hexagonal container (lab + tech) -->
    <path d="M20 4 L34 12 L34 28 L20 36 L6 28 L6 12 Z" fill="none" stroke="url(#accent)" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Inner nodes (neural network / listening) -->
    <circle cx="20" cy="14" r="2.5" fill="#3B82F6"/>
    <circle cx="13" cy="26" r="2" fill="#60A5FA"/>
    <circle cx="27" cy="26" r="2" fill="#60A5FA"/>
    <!-- Connections -->
    <line x1="20" y1="14" x2="13" y2="26" stroke="#3B82F6" stroke-width="1.2" opacity="0.6"/>
    <line x1="20" y1="14" x2="27" y2="26" stroke="#3B82F6" stroke-width="1.2" opacity="0.6"/>
    <line x1="13" y1="26" x2="27" y2="26" stroke="#60A5FA" stroke-width="1" opacity="0.4"/>
    <!-- Signal waves (listening) -->
    <path d="M30 8 Q35 12, 30 16" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
    <path d="M33 6 Q40 12, 33 18" fill="none" stroke="#3B82F6" stroke-width="0.8" opacity="0.3"/>
  </g>
  <!-- Wordmark -->
  <text x="50" y="32" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="22" font-weight="700" fill="white" letter-spacing="-0.5">
    <tspan>Ers</tspan><tspan fill="#3B82F6">Labs</tspan>
  </text>
</svg>
