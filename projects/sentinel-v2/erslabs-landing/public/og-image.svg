<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1C"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle glow -->
  <circle cx="600" cy="260" r="300" fill="url(#glow)"/>
  <!-- Grid dots pattern -->
  <g opacity="0.08" fill="#3B82F6">
    <circle cx="100" cy="100" r="1.5"/><circle cx="150" cy="100" r="1.5"/><circle cx="200" cy="100" r="1.5"/>
    <circle cx="100" cy="150" r="1.5"/><circle cx="150" cy="150" r="1.5"/><circle cx="200" cy="150" r="1.5"/>
    <circle cx="1000" cy="450" r="1.5"/><circle cx="1050" cy="450" r="1.5"/><circle cx="1100" cy="450" r="1.5"/>
    <circle cx="1000" cy="500" r="1.5"/><circle cx="1050" cy="500" r="1.5"/><circle cx="1100" cy="500" r="1.5"/>
  </g>
  <!-- Logo icon (large) -->
  <g transform="translate(505, 160) scale(3)">
    <path d="M20 4 L34 12 L34 28 L20 36 L6 28 L6 12 Z" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="20" cy="14" r="2.5" fill="#3B82F6"/>
    <circle cx="13" cy="26" r="2" fill="#60A5FA"/>
    <circle cx="27" cy="26" r="2" fill="#60A5FA"/>
    <line x1="20" y1="14" x2="13" y2="26" stroke="#3B82F6" stroke-width="1" opacity="0.6"/>
    <line x1="20" y1="14" x2="27" y2="26" stroke="#3B82F6" stroke-width="1" opacity="0.6"/>
    <line x1="13" y1="26" x2="27" y2="26" stroke="#60A5FA" stroke-width="0.8" opacity="0.4"/>
    <path d="M30 8 Q35 12, 30 16" fill="none" stroke="#3B82F6" stroke-width="0.8" opacity="0.5"/>
    <path d="M33 6 Q40 12, 33 18" fill="none" stroke="#3B82F6" stroke-width="0.6" opacity="0.3"/>
  </g>
  <!-- Wordmark -->
  <text x="600" y="420" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="72" font-weight="700" fill="white" letter-spacing="-2">
    <tspan>Ers</tspan><tspan fill="#3B82F6">Labs</tspan>
  </text>
  <!-- Tagline -->
  <text x="600" y="470" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="22" fill="#94A3B8" letter-spacing="0.5">
    We build apps by listening to real problems
  </text>
</svg>
